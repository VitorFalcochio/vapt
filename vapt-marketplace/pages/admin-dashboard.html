<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin VAPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="container dashboard-shell">
        <aside class="dashboard-sidebar">
          <nav class="panel dashboard-nav">
            <a class="is-active" href="./admin-dashboard.html">Visao geral</a>
            <a href="./admin-users.html">Usuarios</a>
            <a href="./admin-stores.html">Lojas</a>
            <a href="./admin-orders.html">Pedidos</a>
            <a href="./admin-products.html">Produtos</a>
            <a href="./admin-logs.html">Logs</a>
          </nav>
        </aside>
        <section class="dashboard-main">
          <article class="panel">
            <div class="section-heading">
              <div>
                <h1 class="section-title">Dashboard administrativo</h1>
                <p class="section-subtitle">Estrutura premium com KPIs, tabelas e base para crescimento futuro.</p>
              </div>
            </div>
          </article>
          <div class="metrics-grid" data-admin-metrics></div>
          <div class="admin-highlight">
            <article class="panel table-shell">
              <div class="section-heading">
                <div>
                  <h2 class="section-title">Pedidos monitorados</h2>
                  <p class="section-subtitle">Leitura macro da plataforma.</p>
                </div>
              </div>
              <table>
                <thead>
                  <tr><th>Pedido</th><th>Cliente</th><th>Loja</th><th>Status</th><th>Total</th></tr>
                </thead>
                <tbody data-admin-orders></tbody>
              </table>
            </article>
            <article class="panel table-shell">
              <div class="section-heading">
                <div>
                  <h2 class="section-title">Logs recentes</h2>
                  <p class="section-subtitle">Base visual para auditoria.</p>
                </div>
              </div>
              <table>
                <thead>
                  <tr><th>Hora</th><th>Origem</th><th>Acao</th><th>Detalhe</th></tr>
                </thead>
                <tbody data-admin-logs></tbody>
              </table>
            </article>
          </div>
        </section>
      </div>
    </main>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
